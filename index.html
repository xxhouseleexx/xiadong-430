<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>下东430号 · 出租屋管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="loading" id="LS">
  <div class="lg">🏠</div>
  <div class="lt">下东430号 · 正在连接云端...</div>
  <div class="spinner"></div>
</div>

<div class="topbar">
  <h1><span class="dot" id="SD"></span>下东430号 · 出租屋管理</h1>
  <div class="sub" id="TD"></div>
</div>

<div class="page active" id="page-home"></div>
<div class="page" id="page-tenants"></div>
<div class="page" id="page-meter"></div>
<div class="page" id="page-bill"></div>
<div class="page" id="page-finance"></div>
<div class="page" id="page-more"></div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="showPage('home',this)"><div class="ic">📊</div><div>总览</div></div>
  <div class="nav-item" onclick="showPage('tenants',this)"><div class="ic">👥</div><div>租客</div></div>
  <div class="nav-item" onclick="showPage('meter',this)"><div class="ic">⚡</div><div>抄表</div></div>
  <div class="nav-item" onclick="showPage('bill',this)"><div class="ic">🧾</div><div>账单</div></div>
  <div class="nav-item" onclick="showPage('finance',this)"><div class="ic">💰</div><div>财务</div></div>
  <div class="nav-item" onclick="showPage('more',this)"><div class="ic">⚙️</div><div>更多</div></div>
</div>

<div class="modal-overlay" id="M_tenant">
  <div class="mbox">
    <div class="mhandle"></div>
    <div class="mtitle" id="M_tenant_title">添加租客</div>
    <input type="hidden" id="e_id">
    <div class="form-row">
      <div class="form-item"><label>姓名 *</label><input id="e_name"></div>
      <div class="form-item"><label>房间号 *</label><input id="e_room" placeholder="如 101"></div>
    </div>
    <div class="form-item"><label>联系电话</label><input id="e_phone" type="tel"></div>
    <div class="form-item"><label>入住日期</label><input id="e_checkin" type="date"></div>
    <div class="form-row">
      <div class="form-item"><label>月租金</label><input id="e_rent" type="number" inputmode="decimal"></div>
      <div class="form-item"><label>押金</label><input id="e_deposit" type="number" inputmode="decimal"></div>
    </div>
    <div class="form-item"><label>押金状态</label>
      <select id="e_dstatus">
        <option value="held">已收</option>
        <option value="bad">未收（坏账）</option>
        <option value="returned">已退还</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-item"><label>卫生费/月</label><input id="e_clean" type="number" inputmode="decimal"></div>
      <div class="form-item"><label>网费/月</label><input id="e_net" type="number" inputmode="decimal"></div>
    </div>
    <div class="form-item"><label>备注</label><input id="e_note"></div>
    <button class="btn btn-primary" onclick="saveTenant()">保存</button>
    <button class="btn btn-gray" onclick="CM('M_tenant')">取消</button>
  </div>
</div>

<div class="modal-overlay" id="M_meter">
  <div class="mbox">
    <div class="mhandle"></div>
    <div class="mtitle">录入表数</div>
    <div class="form-item"><label>租客</label><input id="m_name" readonly></div>
    <input type="hidden" id="m_tid">
    <div class="form-item"><label>月份</label><input id="m_month" type="month"></div>
    <div class="form-row">
      <div class="form-item"><label>上月电表</label><input id="m_el" type="number" inputmode="decimal" oninput="calcMeter()"></div>
      <div class="form-item"><label>本月电表</label><input id="m_ec" type="number" inputmode="decimal" oninput="calcMeter()"></div>
    </div>
    <div class="form-row">
      <div class="form-item"><label>上月水表</label><input id="m_wl" type="number" inputmode="decimal" oninput="calcMeter()"></div>
      <div class="form-item"><label>本月水表</label><input id="m_wc" type="number" inputmode="decimal" oninput="calcMeter()"></div>
    </div>
    <div class="calc-box" id="mCalc">填写表数后自动计算</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="saveMeter()">保存表数</button>
    <button class="btn btn-gray" onclick="CM('M_meter')">取消</button>
  </div>
</div>

<div class="modal-overlay" id="M_expense">
  <div class="mbox">
    <div class="mhandle"></div>
    <div class="mtitle">记录支出 / 采购</div>
    <input type="hidden" id="ex_id">
    <div class="form-row">
      <div class="form-item"><label>类型</label>
        <select id="ex_type">
          <option value="material">材料采购</option>
          <option value="repair">维修费用</option>
          <option value="utility">水电公摊</option>
          <option value="cleaning">卫生清洁</option>
          <option value="other">其他</option>
        </select>
      </div>
      <div class="form-item"><label>日期</label><input id="ex_date" type="date"></div>
    </div>
    <div class="form-item"><label>金额 *</label><input id="ex_amount" type="number" inputmode="decimal"></div>
    <div class="form-item"><label>说明 *</label><input id="ex_desc" placeholder="如：购买水管、灯泡"></div>
    <div class="form-item"><label>关联房间（选填）</label><input id="ex_room"></div>
    <div class="form-item"><label>备注</label><input id="ex_note"></div>
    <button class="btn btn-amber" onclick="saveExpense()">保存支出</button>
    <button class="btn btn-gray" onclick="CM('M_expense')">取消</button>
  </div>
</div>

<div class="modal-overlay" id="M_bill">
  <div class="mbox">
    <div class="mhandle"></div>
    <div id="M_bill_content"></div>
    <button class="btn btn-gray" style="margin-top:6px" onclick="CM('M_bill')">关闭</button>
  </div>
</div>

<div class="confirm-overlay" id="M_confirm">
  <div class="cbox">
    <div class="ct" id="c_title"></div>
    <div class="cs" id="c_msg"></div>
    <div class="cbtns">
      <button class="btn btn-gray" onclick="CM('M_confirm')">取消</button>
      <button class="btn btn-danger" id="c_ok">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="TOAST"></div>

<script type="module" src="firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
