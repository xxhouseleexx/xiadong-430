<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>下东 430 号 · 出租屋管理</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #f8f9fa;
            color: #1a1a1a;
            min-height: 100vh;
            padding-bottom: 80px;
            line-height: 1.5;
        }
        .topbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 20px 18px 14px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(102, 126, 234, 0.3);
        }
        .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
        .topbar .sub { font-size: 12px; opacity: 0.85; margin-top: 4px; font-weight: 400; }
        .sync-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #48c774;
            margin-right: 6px;
            vertical-align: middle;
            box-shadow: 0 0 0 2px rgba(72, 199, 116, 0.2);
        }
        .sync-dot.syncing { background: #ffdd57; animation: pulse 1s infinite; }
        .sync-dot.error { background: #f14668; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.1); } }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            display: flex;
            border-top: 1px solid #e8e8e8;
            z-index: 200;
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.06);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0 6px;
            cursor: pointer;
            color: #999;
            font-size: 10px;
            gap: 3px;
            transition: all 0.2s ease;
        }
        .nav-item .icon { font-size: 22px; line-height: 1; transition: transform 0.2s ease; }
        .nav-item.active { color: #667eea; }
        .nav-item.active .icon { transform: scale(1.1); }
        
        .page { display: none; padding: 16px; }
        .page.active { display: block; }
        
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 14px;
            letter-spacing: -0.2px;
        }
        
        .form-item { margin-bottom: 12px; }
        .form-item label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .form-item input, .form-item select, .form-item textarea {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fafafa;
            -webkit-appearance: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .form-item input:focus, .form-item select:focus {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 13px 18px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 10px;
            letter-spacing: -0.2px;
        }
        .btn:active { transform: scale(0.97); }
        .btn:last-child { margin-bottom: 0; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
        .btn-success { background: linear-gradient(135deg, #48c774 0%, #29b67a 100%); color: #fff; box-shadow: 0 4px 12px rgba(72, 199, 116, 0.3); }
        .btn-danger { background: linear-gradient(135deg, #f14668 0%, #e03a5a 100%); color: #fff; box-shadow: 0 4px 12px rgba(241, 70, 104, 0.3); }
        .btn-warning { background: linear-gradient(135deg, #ffdd57 0%, #ffd93d 100%); color: #333; box-shadow: 0 4px 12px rgba(255, 221, 87, 0.3); }
        .btn-outline { background: #fff; color: #667eea; border: 2px solid #667eea; }
        .btn-gray { background: #f5f5f5; color: #666; }
        .btn-orange { background: linear-gradient(135deg, #ff9f43 0%, #ff8c2a 100%); color: #fff; box-shadow: 0 4px 12px rgba(255, 159, 67, 0.3); }
        .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; margin-bottom: 0; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .stat-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .stat-num { font-size: 24px; font-weight: 800; color: #667eea; line-height: 1.1; letter-spacing: -0.5px; }
        .stat-num.red { color: #f14668; }
        .stat-num.green { color: #48c774; }
        .stat-num.orange { color: #ff9f43; }
        .stat-label { font-size: 11px; color: #999; margin-top: 4px; font-weight: 500; }
        
        .list-item {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease;
        }
        .list-item:active { transform: scale(0.98); }
        .item-row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .item-name { font-size: 16px; font-weight: 700; color: #1a1a1a; }
        .room-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-radius: 8px;
            padding: 3px 10px;
            font-size: 12px;
            font-weight: 600;
        }
        .item-info { font-size: 13px; color: #666; line-height: 1.9; }
        .item-amount { font-size: 18px; font-weight: 800; color: #667eea; letter-spacing: -0.5px; }
        
        .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-green { background: #d4edda; color: #28a745; }
        .badge-red { background: #f8d7da; color: #dc3545; }
        .badge-yellow { background: #fff3cd; color: #ffc107; }
        .badge-blue { background: #d1ecf1; color: #17a2b8; }
        .badge-gray { background: #e9ecef; color: #6c757d; }
        .badge-orange { background: #ffe5d0; color: #fd7e14; }
        
        .bill-card {
            background: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 2px solid #e8f0fe;
        }
        .bill-header { text-align: center; margin-bottom: 16px; }
        .bill-header .title { font-size: 18px; font-weight: 800; color: #667eea; letter-spacing: -0.3px; }
        .bill-header .sub { font-size: 13px; color: #888; margin-top: 4px; }
        .bill-line { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px dashed #e8e8e8; font-size: 14px; }
        .bill-line .key { color: #555; font-weight: 500; }
        .bill-line .val { font-weight: 700; color: #1a1a1a; }
        .bill-total-line { display: flex; justify-content: space-between; padding: 12px 0 0; font-size: 17px; font-weight: 800; color: #667eea; border-top: 2px solid #667eea; margin-top: 6px; letter-spacing: -0.5px; }
        .bill-note { text-align: center; font-size: 12px; color: #999; margin-top: 12px; padding-top: 10px; border-top: 1px dashed #eee; }
        
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 500;
            align-items: flex-end;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 22px 18px 30px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-handle { width: 40px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 16px; }
        .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; color: #1a1a1a; letter-spacing: -0.3px; }
        
        .confirm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 600;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(2px);
        }
        .confirm-overlay.show { display: flex; }
        .confirm-box {
            background: #fff;
            border-radius: 18px;
            padding: 24px 20px;
            width: 88%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }
        .confirm-box .ct { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #1a1a1a; }
        .confirm-box .cs { font-size: 14px; color: #666; margin-bottom: 20px; line-height: 1.6; }
        .confirm-btns { display: flex; gap: 10px; }
        .confirm-btns .btn { margin-bottom: 0; }
        
        .loading-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-screen .logo { font-size: 56px; margin-bottom: 20px; animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .loading-screen .text { font-size: 16px; color: rgba(255, 255, 255, 0.95); margin-bottom: 24px; font-weight: 500; }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .empty { text-align: center; color: #bbb; padding: 40px 20px; font-size: 14px; }
        .empty .ei { font-size: 42px; margin-bottom: 10px; opacity: 0.6; }
        .section-label { font-size: 13px; color: #888; font-weight: 700; margin: 18px 0 10px; padding-left: 4px; letter-spacing: -0.2px; text-transform: uppercase; }
        .calc-box {
            background: linear-gradient(135deg, #e8f0fe 0%, #f0f6ff 100%);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            color: #667eea;
            margin-top: 10px;
            line-height: 2;
            border: 1px solid #d0e1ff;
        }
        .warn-box {
            background: linear-gradient(135deg, #fff8e1 0%, #fff9e8 100%);
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 13px;
            color: #f57c00;
            margin-top: 10px;
            line-height: 1.8;
            border: 1px solid #ffe0b2;
        }
        
        .tab-bar {
            display: flex;
            background: #f0f2f5;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 14px;
        }
        .tab-btn {
            flex: 1;
            padding: 9px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            color: #888;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #fff;
            color: #667eea;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }
        
        .year-selector { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 14px; }
        .year-selector button {
            background: #fff;
            border: 2px solid #e8e8e8;
            font-size: 18px;
            cursor: pointer;
            color: #667eea;
            padding: 6px 12px;
            border-radius: 10px;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .year-selector button:active { background: #667eea; color: #fff; border-color: #667eea; }
        .year-selector span { font-size: 17px; font-weight: 700; color: #1a1a1a; min-width: 80px; text-align: center; }
        
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 13px 24px;
            border-radius: 14px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            font-weight: 500;
        }
        .toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        
        .settings-section { margin-bottom: 20px; }
        .settings-title { font-size: 14px; font-weight: 700; color: #667eea; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        
        @media (min-width: 600px) {
            body { max-width: 480px; margin: 0 auto; box-shadow: 0 0 40px rgba(0, 0, 0, 0.08); }
            .bottom-nav { max-width: 480px; left: 50%; transform: translateX(-50%); }
        }
    </style>
</head>
<body>
    <!-- 加载屏 -->
    <div class="loading-screen" id="loadingScreen">
        <div class="logo">🏠</div>
        <div class="text">下东 430 号 · 正在连接云端...</div>
        <div class="spinner"></div>
    </div>

    <div class="topbar">
        <h1><span class="sync-dot" id="syncDot"></span>下东 430 号 · 出租屋管理</h1>
        <div class="sub" id="topDate"></div>
    </div>

    <div class="page active" id="page-home"></div>
    <div class="page" id="page-tenants"></div>
    <div class="page" id="page-meter"></div>
    <div class="page" id="page-bill"></div>
    <div class="page" id="page-finance"></div>
    <div class="page" id="page-more"></div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="showPage('home',this)">
            <div class="icon">📊</div>
            <div>总览</div>
        </div>
        <div class="nav-item" onclick="showPage('tenants',this)">
            <div class="icon">👥</div>
            <div>租客</div>
        </div>
        <div class="nav-item" onclick="showPage('meter',this)">
            <div class="icon">⚡</div>
            <div>抄表</div>
        </div>
        <div class="nav-item" onclick="showPage('bill',this)">
            <div class="icon">🧾</div>
            <div>账单</div>
        </div>
        <div class="nav-item" onclick="showPage('finance',this)">
            <div class="icon">💰</div>
            <div>财务</div>
        </div>
        <div class="nav-item" onclick="showPage('more',this)">
            <div class="icon">⚙️</div>
            <div>更多</div>
        </div>
    </div>

    <!-- 弹窗：租客 -->
    <div class="modal-overlay" id="tenantModal">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <div class="modal-title" id="tenantModalTitle">添加租客</div>
            <input type="hidden" id="e_id">
            <div class="form-row">
                <div class="form-item">
                    <label>姓名 *</label>
                    <input id="e_name" placeholder="租客姓名">
                </div>
                <div class="form-item">
                    <label>房间号 *</label>
                    <input id="e_room" placeholder="如 101">
                </div>
            </div>
            <div class="form-item">
                <label>联系电话</label>
                <input id="e_phone" type="tel" placeholder="手机号码">
            </div>
            <div class="form-item">
                <label>入住日期</label>
                <input id="e_checkin" type="date">
            </div>
            <div class="form-row">
                <div class="form-item">
                    <label>月租金（元）</label>
                    <input id="e_rent" type="number" placeholder="0" inputmode="decimal">
                </div>
                <div class="form-item">
                    <label>押金（元）</label>
                    <input id="e_deposit" type="number" placeholder="0" inputmode="decimal">
                </div>
            </div>
            <div class="form-item">
                <label>押金状态</label>
                <select id="e_depositStatus">
                    <option value="held">已收（在手）</option>
                    <option value="bad">未收（坏账）</option>
                    <option value="returned">已退还</option>
                </select>
            </div>
            <div class="form-row">
                <div class="form-item">
                    <label>卫生费/月</label>
                    <input id="e_clean" type="number" placeholder="0" inputmode="decimal">
                </div>
                <div class="form-item">
                    <label>网费/月</label>
                    <input id="e_net" type="number" placeholder="0" inputmode="decimal">
                </div>
            </div>
            <div class="form-item">
                <label>备注</label>
                <input id="e_note" placeholder="备注信息">
            </div>
            <button class="btn btn-primary" onclick="saveTenant()">💾 保存</button>
            <button class="btn btn-gray" onclick="closeModal('tenantModal')">取消</button>
        </div>
    </div>

    <!-- 弹窗：抄表 -->
    <div class="modal-overlay" id="meterModal">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <div class="modal-title">⚡ 录入表数</div>
            <div class="form-item">
                <label>租客</label>
                <input id="m_tenant_name" readonly style="background:#f5f5f5;color:#888;">
            </div>
            <input type="hidden" id="m_tenant_id">
            <div class="form-item">
                <label>抄表月份</label>
                <input id="m_month" type="month">
            </div>
            <div class="form-row">
                <div class="form-item">
                    <label>上月电表（度）</label>
                    <input id="m_elec_last" type="number" placeholder="0" inputmode="decimal" oninput="calcMeter()">
                </div>
                <div class="form-item">
                    <label>本月电表（度）</label>
                    <input id="m_elec_cur" type="number" placeholder="0" inputmode="decimal" oninput="calcMeter()">
                </div>
            </div>
            <div class="form-row">
                <div class="form-item">
                    <label>上月水表（吨）</label>
                    <input id="m_water_last" type="number" placeholder="0" inputmode="decimal" oninput="calcMeter()">
                </div>
                <div class="form-item">
                    <label>本月水表（吨）</label>
                    <input id="m_water_cur" type="number" placeholder="0" inputmode="decimal" oninput="calcMeter()">
                </div>
            </div>
            <div class="calc-box" id="meterCalcBox">填写表数后自动计算费用预览</div>
            <button class="btn btn-primary" style="margin-top:12px;" onclick="saveMeter()">💾 保存表数</button>
            <button class="btn btn-gray" onclick="closeModal('meterModal')">取消</button>
        </div>
    </div>

    <!-- 弹窗：支出 -->
    <div class="modal-overlay" id="expenseModal">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <div class="modal-title">🛒 记录支出/采购</div>
            <input type="hidden" id="ex_id">
            <div class="form-row">
                <div class="form-item">
                    <label>支出类型</label>
                    <select id="ex_type">
                        <option value="material">🔧 材料采购</option>
                        <option value="repair">🛠 维修费用</option>
                        <option value="utility">💡 水电公摊</option>
                        <option value="cleaning">🧹 卫生清洁</option>
                        <option value="other">📦 其他支出</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>日期</label>
                    <input id="ex_date" type="date">
                </div>
            </div>
            <div class="form-item">
                <label>金额（元）*</label>
                <input id="ex_amount" type="number" placeholder="0.00" inputmode="decimal">
            </div>
            <div class="form-item">
                <label>物品/说明 *</label>
                <input id="ex_desc" placeholder="如：购买水管、灯泡等">
            </div>
            <div class="form-item">
                <label>关联房间（选填）</label>
                <input id="ex_room" placeholder="如 101，公共区域留空">
            </div>
            <div class="form-item">
                <label>备注</label>
                <input id="ex_note" placeholder="补充说明">
            </div>
            <button class="btn btn-orange" onclick="saveExpense()">💾 保存支出</button>
            <button class="btn btn-gray" onclick="closeModal('expenseModal')">取消</button>
        </div>
    </div>

    <!-- 弹窗：账单 -->
    <div class="modal-overlay" id="billModal">
        <div class="modal-box">
            <div class="modal-handle"></div>
            <div id="billModalContent"></div>
            <button class="btn btn-gray" style="margin-top:4px;" onclick="closeModal('billModal')">关闭</button>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="confirm-overlay" id="confirmModal">
        <div class="confirm-box">
            <div class="ct" id="confirmTitle">确认操作</div>
            <div class="cs" id="confirmMsg"></div>
            <div class="confirm-btns">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUJeiIHJUnDtNYszLz5HEDUiKaDc8Th3M",
            authDomain: "xiadong-430.firebaseapp.com",
            projectId: "xiadong-430",
            storageBucket: "xiadong-430.firebasestorage.app",
            messagingSenderId: "1062042458951",
            appId: "1:1062042458951:web:0b0341fe18cbe01d9cca62"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==================== 本地数据缓存 ====================
        window.localData = {
            tenants: [],
            meters: [],
            bills: [],
            expenses: [],
            settings: {
                elec: 1.5,
                water: 5.0,
                note: '请于每月 5 日前完成缴费，谢谢！'
            }
        };

        function setSyncStatus(status) {
            const dot = document.getElementById('syncDot');
            dot.className = 'sync-dot' + (status === 'syncing' ? ' syncing' : status === 'error' ? ' error' : '');
        }

        // ==================== 实时监听 Firestore ====================
        function listenCollection(name, localKey) {
            const q = query(collection(db, name));
            onSnapshot(q, (snapshot) => {
                window.localData[localKey] = [];
                snapshot.forEach(doc => window.localData[localKey].push({ id: doc.id, ...doc.data() }));
                setSyncStatus('ok');
                const activePage = document.querySelector('.page.active');
                if (activePage) {
                    const pageId = activePage.id.replace('page-', '');
                    const renders = { home: renderHome, tenants: renderTenants, meter: renderMeter, bill: renderBill, finance: renderFinance, more: renderMore };
                    if (renders[pageId]) renders[pageId]();
                }
            }, () => setSyncStatus('error'));
        }

        function listenSettings() {
            onSnapshot(doc(db, 'meta', 'settings'), (snap) => {
                if (snap.exists()) window.localData.settings = snap.data();
            });
        }

        async function dbSet(collName, id, data) {
            setSyncStatus('syncing');
            try {
                await setDoc(doc(db, collName, id), data);
                setSyncStatus('ok');
            } catch(e) {
                setSyncStatus('error');
                toast('❌ 同步失败，请检查网络');
            }
        }

        async function dbDel(collName, id) {
            setSyncStatus('syncing');
            try {
                await deleteDoc(doc(db, collName, id));
                setSyncStatus('ok');
            } catch(e) {
                setSyncStatus('error');
            }
        }

        async function dbSetSettings(data) {
            setSyncStatus('syncing');
            try {
                await setDoc(doc(db, 'meta', 'settings'), data);
                setSyncStatus('ok');
            } catch(e) {
                setSyncStatus('error');
            }
        }

        window.dbSet = dbSet;
        window.dbDel = dbDel;
        window.dbSetSettings = dbSetSettings;

        listenCollection('tenants', 'tenants');
        listenCollection('meters', 'meters');
        listenCollection('bills', 'bills');
        listenCollection('expenses', 'expenses');
        listenSettings();

        setTimeout(() => {
            document.getElementById('loadingScreen').style.display = 'none';
            renderHome();
        }, 1800);
    </script>
